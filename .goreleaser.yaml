# goreleaser configuration for drillproof-audit.
#
#   goreleaser check              validate this file
#   goreleaser release --snapshot --clean    build locally without publishing
#   goreleaser release --clean    tagged release (CI only)
version: 2

project_name: drillproof-audit

before:
  hooks:
    - go mod tidy
    - go test ./...
    # The Homebrew cask below ships shell completions. Nothing else creates
    # them, so without these the release fails on a missing file — and it fails
    # at the packaging step, after the binaries have already been built.
    #
    # `sh -c` because goreleaser hooks are exec'd, not run through a shell, so a
    # bare `>` redirect would be passed to cobra as an argument.
    - mkdir -p completions
    - sh -c "go run ./cmd/drillproof completion bash > completions/drillproof.bash"
    - sh -c "go run ./cmd/drillproof completion zsh  > completions/drillproof.zsh"
    - sh -c "go run ./cmd/drillproof completion fish > completions/drillproof.fish"

builds:
  - id: drillproof
    main: ./cmd/drillproof
    binary: drillproof
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # 32-bit and other combinations are not worth supporting for a tool that
    # talks to cloud APIs from an engineer's machine or a CI runner.
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids: [drillproof]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

snapshot:
  # Deliberately NOT `{{ incpatch .Version }}-next`. `incpatch` parses .Version
  # as semver, and .Version comes from the most recent tag — which for a while
  # was release-please's component-prefixed `drillproof-audit-v1.1.0`. That is
  # not semver, so the CI snapshot job died at the first step with
  # "failed to parse snapshot name: invalid semantic version", while every real
  # build and test passed.
  #
  # `include-component-in-tag: false` in release-please-config.json stops new
  # tags from being prefixed, but the old tag stays in history and is still what
  # goreleaser resolves against, so that alone does not unbreak this. A commit
  # SHA needs no parsing at all, and snapshot version numbers are throwaway —
  # nothing is published from snapshot mode — so there is nothing to gain from
  # making this job's success depend on how tags happen to be spelled.
  version_template: "0.0.0-next-{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 99

# Homebrew tap: `brew install drillproof/tap/audit`
#
# Casks rather than formulae: goreleaser deprecated `brews` in favour of
# `homebrew_casks`, because a cask installs a prebuilt binary, which is what we
# ship. Formulae are for things Homebrew builds from source.
homebrew_casks:
  - name: audit
    ids: [default]
    binaries:
      - drillproof
    repository:
      owner: drillproof
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://drillproof.com
    description: Read-only recoverability audit for AWS and Kubernetes backups
    license: Apache-2.0
    completions:
      bash: completions/drillproof.bash
      zsh: completions/drillproof.zsh
      fish: completions/drillproof.fish
    hooks:
      post:
        # The binary is not notarised, so Gatekeeper quarantines it and the
        # first run dies with "cannot be opened". Stripping the attribute at
        # install time is the documented workaround until signing is set up.
        install: |
          if OS.mac?
            system "xattr", "-d", "-r", "com.apple.quarantine", "#{staged_path}/drillproof"
          end

# dockers_v2 builds multi-platform images in one block, so it replaces both the
# old per-arch `dockers` entries and the `docker_manifests` that stitched them
# together.
dockers_v2:
  - id: drillproof
    ids: [drillproof]
    dockerfile: Dockerfile
    # GHCR, not Docker Hub. Three reasons, in order of how much they matter:
    #   1. Docker Hub's anonymous pull limit (100 per 6h per IP) lands on USERS,
    #      and a shared corporate NAT exhausts it quickly. GHCR does not rate
    #      limit anonymous pulls of public images.
    #   2. The built-in GITHUB_TOKEN can push here, so no DOCKERHUB_* secrets.
    #   3. The namespace matches the source repo, so the package links itself to
    #      it via the org.opencontainers.image.source label below.
    #
    # MUST be lowercase. The GitHub org is spelled `DrillProof`, but GHCR
    # rejects any uppercase in an image reference — `ghcr.io/DrillProof/audit`
    # fails at push with an unhelpful error.
    images:
      - ghcr.io/drillproof/audit
    tags:
      - "{{ .Version }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: drillproof-audit
      org.opencontainers.image.description: Read-only recoverability audit for AWS and Kubernetes backups
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.source: https://github.com/drillproof/audit

release:
  github:
    owner: drillproof
    name: audit

  # release-please creates the GitHub Release (with the changelog) when its PR
  # is merged; goreleaser then runs against that same tag. Without `append` it
  # would try to create a release that already exists and fail the job.
  #
  # `append` also keeps release-please's changelog body intact — goreleaser adds
  # its artifacts rather than overwriting the notes a human just reviewed.
  mode: append

  # Ship the installer as a release asset so `get.drillproof.com` can serve
  # `/releases/latest/download/install.sh` instead of a git ref.
  #
  # This is what keeps the installer honest without a human remembering to bump
  # a pin. Serving a branch tip would put an unreviewed commit on a URL people
  # pipe into a shell; serving a hardcoded tag goes stale, and a stale installer
  # is not a cosmetic problem — the archive name it builds is coupled to
  # `name_template` below, so a template change 404s for every user at once.
  # Attaching it here means the installer served is always the one reviewed and
  # tagged alongside the binaries it downloads.
  extra_files:
    - glob: scripts/install.sh

  footer: |
    ---

    **Privacy**: this tool runs locally with your own credentials, is strictly
    read-only, and sends nothing anywhere. See the README for the exact IAM
    policy it needs, or run `drillproof audit init`.
