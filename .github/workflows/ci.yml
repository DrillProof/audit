name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || (echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy'" && exit 1)

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned, with .golangci.yml pinning the linter set to match.
          version: v2.12.2

  # The read-only promise is the product's core claim, so it gets its own gate
  # rather than living only inside the test suite.
  readonly-guarantee:
    name: Read-only guarantee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Interfaces expose no mutating operations
        run: go test -run 'TestInterfacesAreReadOnly|TestPolicyIsReadOnly' -v ./internal/...

      - name: No mutating AWS SDK calls anywhere in the source
        run: |
          # Catches a mutating call made directly on an SDK client, bypassing
          # our interfaces. Test files are excluded; fakes legitimately mention
          # mutating verbs when asserting they are absent.
          if grep -rnE '\.(CreateBackup|StartBackupJob|StartRestoreJob|DeleteRecoveryPoint|DeleteBackupVault|CreateSnapshot|DeleteSnapshot|RestoreDBInstance|DeleteDBInstance|ModifyDBInstance|CreateVolume|DeleteVolume|CreateCluster|DeleteCluster|PutObject|DeleteObject|PutObjectLockConfiguration)\(' \
             --include='*.go' . | grep -v '_test.go'; then
            echo "::error::a mutating AWS call is present — v1 must be read-only"
            exit 1
          fi
          echo "No mutating AWS calls found."

  build-matrix:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o /tmp/drillproof-${{ matrix.goos }}-${{ matrix.goarch }} .

  goreleaser-check:
    name: Validate release config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
      - name: Snapshot build
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,docker,sbom
